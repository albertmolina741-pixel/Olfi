<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Olfi</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout: una columna de móvil a pantalla completa; contenido con scroll y barra de pestañas fija abajo. Tema claro único (marca sobre blanco). */
:root{
  --bg:#FFFFFF; --ink:#141414; --muted:#6B6B6B; --line:#E8E8E8; --soft:#F4F4F4;
  --brand:#1C2E4A; --neroli:#D9572A; --good:#2F6E48; --warn:#A4532D;
  --font:'Outfit', -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;position:relative}
main{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:8px calc(96px + env(safe-area-inset-bottom, 0px))}
h1,h2{margin:0;font-weight:600;letter-spacing:-0.02em;text-wrap:balance}
h1{font-size:26px} h2{font-size:18px}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .sm{font-size:13px} .xs{font-size:12px}
.cap{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.card{border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.btn{height:46px;padding:0 18px;border-radius:23px;border:1px solid #D6D6D6;background:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.pill{height:36px;padding:0 14px;border-radius:18px;border:1px solid #D6D6D6;background:#fff;font-weight:600;font-size:13px;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.ib{width:44px;height:44px;border:none;background:none;display:inline-flex;align-items:center;justify-content:center;border-radius:22px;color:var(--ink);flex-shrink:0}
.tap{border:none;background:none;padding:0;text-align:left;width:100%;color:inherit}
.score{font-weight:700;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px 3px 3px;border-radius:16px;border:1px solid var(--line);background:#fff}
.chip img,.chip .ph{width:24px;height:24px;border-radius:12px;object-fit:cover}
.ph{display:inline-flex;align-items:center;justify-content:center;background:var(--soft);color:var(--muted);font-weight:600}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.hscroll::-webkit-scrollbar{display:none}
.avatar{border-radius:50%;background:#EDEDED;display:inline-flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.list>*{border-bottom:1px solid var(--line)} .list>*:last-child{border-bottom:none}
.plank{height:8px;border-radius:5px;background:linear-gradient(#EFEFEF,#E2E2E2);box-shadow:0 8px 10px -8px rgba(20,20,20,.45)}
.shelf{display:grid;align-items:end;padding:0 6px}
.shelf img{display:block;margin:0 auto;max-width:100%}
.empty-bottle{filter:grayscale(1) opacity(.45)}
.bar{height:8px;border-radius:4px;background:var(--soft);position:relative;overflow:hidden}
.bar span{position:absolute;inset:0 auto 0 0;border-radius:4px}
input[type=range]{width:100%;accent-color:var(--brand)}
.field{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:23px;border:1px solid var(--line);background:#fff}
.field input{border:none;outline:none;flex:1;min-width:0;background:transparent;font-size:16px}
textarea.box{width:100%;border:1px solid var(--line);border-radius:16px;padding:12px;font-size:16px;resize:vertical}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:#fff;border-top:1px solid var(--line)}
nav.tabs .in{width:100%;max-width:480px;display:flex;justify-content:space-around;padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px))}
.tab{width:56px;height:48px;border:none;background:none;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.tab[aria-current="page"]{color:var(--brand)}
.tab.scan{color:var(--neroli)}
/* overlays */
.sheet{position:fixed;inset:0;z-index:30;background:#fff;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .wrap{max-width:480px;margin:0 auto;padding-bottom:calc(40px + env(safe-area-inset-bottom, 0px))}
.sheet .bar-top{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:env(safe-area-inset-top, 0px) max(6px, env(safe-area-inset-right, 0px)) 0 max(6px, env(safe-area-inset-left, 0px));background:rgba(255,255,255,.92);backdrop-filter:blur(8px)}
.pad{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.modal{position:fixed;inset:0;z-index:40;background:rgba(20,20,20,.35);display:flex;align-items:flex-end;justify-content:center}
.modal .panel{width:100%;max-width:480px;max-height:80vh;overflow-y:auto;background:#fff;border-radius:22px 22px 0 0;padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.grab{width:36px;height:4px;border-radius:2px;background:#D6D6D6;margin:0 auto 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom, 0px));z-index:50;background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:500;max-width:calc(100% - 32px);text-align:center}
.tier{border-radius:18px;background:var(--soft);padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;margin:0 auto}
.note{display:flex;flex-direction:column;align-items:center;gap:5px;width:66px;font-size:11px;text-align:center;line-height:1.2}
.note img,.note .ph{width:48px;height:48px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px #fff}
.vial{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;font-weight:600;text-align:center;line-height:1.2}
.vial .t{position:relative;width:28px;height:110px;border:1.5px solid rgba(20,20,20,.25);border-top:none;border-radius:0 0 14px 14px;overflow:hidden;background:#fff}
.vial .t span{position:absolute;left:0;right:0;bottom:0}
.seg{display:flex;gap:6px}
.seg a,.seg button{flex:1;height:38px;border-radius:19px;border:1px solid rgba(20,20,20,.25);background:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px}
.seg [aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.logo{display:inline-flex;align-items:center;gap:8px;color:var(--brand)}
.logo .o{border-radius:50%;border-style:solid;border-color:currentColor;display:block}
@media (prefers-reduced-motion: no-preference){.sheet,.modal .panel{animation:up .2s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
</style>


</head>
<body>
<style>
html,body{margin:0}
.lbl{cursor:pointer}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:28px 18px;border:1.5px dashed #DADADA;border-radius:22px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid #D6D6D6;border-top-color:var(--brand);display:inline-block;animation:sp 0.9s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);padding-top:10px;gap:8px}
select.field{appearance:none;-webkit-appearance:none;font-size:16px}
.form label{font-size:13px;font-weight:600;margin-top:4px}
.form .field{padding:0 14px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.two>div{min-width:0}
.form input.field,.form select.field{width:100%;min-width:0}
.ocr{display:flex;flex-wrap:wrap;gap:6px}
.pbox{display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.mono{font-weight:500;color:#9A938A;letter-spacing:.08em}
.ocr button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:6px 10px;font-size:13px}
</style>
<div class="app"><main id="main"></main></div>
<nav class="tabs" aria-label="Navegación principal"><div class="in" id="tabs"></div></nav>
<div id="layer"></div>
<div class="toast" id="toast" role="status" hidden></div>
<input id="cam" type="file" accept="image/*" capture="environment" class="sr" tabindex="-1">
<input id="gal" type="file" accept="image/*" class="sr" tabindex="-1">
<input id="imp" type="file" accept="application/json,.json" class="sr" tabindex="-1">

<script>
const FAMCOL = {Amaderado:'#4E3B7C', Aromático:'#5C7A3A', Gourmand:'#C4862E', Cítrico:'#D19A12', Especiado:'#8A2F1E', Acuático:'#2F6FA6', Floral:'#B23A5C', Ámbar:'#B5652A', Chipre:'#3F5B4A', Fougère:'#46705E', Cuero:'#5A3A2A', Verde:'#4F7D3A', Afrutado:'#C2462F', Almizclado:'#7A6C8E'};
const FAMILIES = Object.keys(FAMCOL);
const CONCS = ['Eau de Parfum','Eau de Toilette','Parfum / Extrait','Eau de Cologne','Body mist','Otra'];

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => v==null ? '–' : Number(v).toLocaleString('es-ES',{minimumFractionDigits:1,maximumFractionDigits:1});
const iso = d => { const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
const daysAgo = n => { const d=new Date(); d.setDate(d.getDate()-n); return iso(d); };
const today = () => iso(new Date());
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const newId = () => 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const famColor = f => FAMCOL[f] || '#6B6B6B';
let S = null;
const P = id => (S && S.items[id]) || TEMP[id];
const mine = id => S.coll.find(c=>c.id===id);
const splitNotes = s => String(s||'').split(/[,;\n]/).map(x=>x.trim()).filter(Boolean).slice(0,6).map(x=>x[0].toUpperCase()+x.slice(1));

const ICON = {
 home:'<path d="M4 10.5L12 4l8 6.5V20h-5.5v-5.5h-5V20H4z"/>', search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
 scan:'<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M9.5 9h5v7a1 1 0 0 1-1 1h-3a1 1 0 0 1-1-1z"/><path d="M11 7h2v2h-2z"/>',
 cal:'<rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4M15 3v4"/>', back:'<path d="M15 5l-7 7 7 7"/>', close:'<path d="M6 6l12 12M18 6L6 18"/>',
 addp:'<path d="M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1"/><circle cx="9.5" cy="7.5" r="3.5"/><path d="M19 8v6M22 11h-6"/>', check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>', img:'<rect x="4" y="5" width="16" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M5 17l4.5-4.5 3 3 2.5-2.5 4 4"/>', plus:'<path d="M12 5v14M5 12h14"/>', chev:'<path d="M9 6l6 6-6 6"/>',
 share:'<path d="M12 15V4M8 8l4-4 4 4M5 13v6h14v-6"/>', tag:'<path d="M4 4h7l9 9-7 7-9-9z"/><circle cx="8.5" cy="8.5" r="1.4"/>', sliders:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>', barcode:'<path d="M4 6v12M7 6v12M10 6v12M14 6v12M16 6v12M20 6v12"/>', down:'<path d="M12 4v11M8 11l4 4 4-4M5 19h14"/>', flash:'<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>'
};
const ic = (n, s=24, w=1.7) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
const symbol = (s=22) => `<span style="display:inline-flex;align-items:center;gap:1px" aria-hidden="true"><span style="width:${s}px;height:${s}px;border:${Math.max(4,Math.round(s*.22))}px solid currentColor;border-radius:50%;display:block"></span><svg width="${Math.round(s*.6)}" height="${Math.round(s*1.05)}" viewBox="0 0 56 96"><path d="M8 26 A 30 30 0 0 1 8 70" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round"/><path d="M28 10 A 52 52 0 0 1 28 86" fill="none" stroke="var(--neroli)" stroke-width="12" stroke-linecap="round"/></svg></span>`;
const logo = (s=22) => `<span class="logo" role="img" aria-label="olfi">${symbol(s)}<span style="font-weight:500;font-size:${s}px;letter-spacing:.02em;line-height:1">olfi</span></span>`;
function bottleSVG(fam, h, empty=false){
  const c = empty ? '#CFCFCF' : famColor(fam); const w=Math.round(h*0.72);
  return `<svg width="${w}" height="${h}" viewBox="0 0 72 100" aria-hidden="true" style="display:block"><rect x="26" y="2" width="20" height="17" rx="3.5" fill="#1F1F1F"/><rect x="31" y="19" width="10" height="6" fill="#BDBDBD"/><rect x="8" y="25" width="56" height="72" rx="13" fill="#FFFFFF" stroke="#CDCDCD" stroke-width="1.6"/><rect x="11" y="${empty?84:46}" width="50" height="${empty?10:48}" rx="10" fill="${c}" opacity=".92"/><rect x="22" y="56" width="28" height="15" rx="2" fill="#FFFFFF" opacity=".88"/><rect x="14" y="31" width="4" height="56" rx="2" fill="#FFFFFF" opacity=".55"/></svg>`;
}
function visual(id, h, empty=false){ return pimg(id, `width:${Math.round(h*.78)}px;height:${h}px;border-radius:14px`, {gray:empty, mono:22}); }
const tile = (id, style) => pimg(id, style, {mono:15, pad:'9%'});
const initials = n => (n||'').trim().split(/\s+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase() || '·';
let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }
const loading = m => `<div class="card row" style="gap:12px"><span class="spin" aria-hidden="true"></span><span class="sm">${m}</span></div>`;
const notice = (t, d='') => `<div class="card"><b style="font-weight:600">${t}</b>${d?`<p class="sm muted" style="margin:4px 0 0">${d}</p>`:''}</div>`;

/* ---------- guardado en el móvil (IndexedDB) ---------- */
const store = (()=>{
  let dbp=null;
  const open=()=> dbp ||= new Promise((res,rej)=>{ const r=indexedDB.open('olfi',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
  const tx=async(mode,fn)=>{ const db=await open(); return new Promise((res,rej)=>{ const t=db.transaction('kv',mode); const q=fn(t.objectStore('kv')); t.oncomplete=()=>res(q?.result); t.onerror=()=>rej(t.error); }); };
  return { get:k=>tx('readonly',s=>s.get(k)), set:(k,v)=>tx('readwrite',s=>s.put(v,k)) };
})();
const empty = () => ({v:3, started:false, name:'', items:{}, coll:[], logs:[], reviews:{}});
let saveT=null;
function save(){ if(!S||!S.started) return; clearTimeout(saveT); saveT=setTimeout(()=>{ store.set('state', S).catch(()=>{ try{ localStorage.setItem('olfi-state', JSON.stringify(S)); }catch(e){ toast('No se ha podido guardar'); } }); }, 250); }
async function load(){ try{ const s=await store.get('state'); if(s) return s; }catch(e){} try{ const j=localStorage.getItem('olfi-state'); return j?JSON.parse(j):null; }catch(e){ return null; } }
navigator.storage?.persist?.().catch(()=>{});

async function toJpeg(src, max=640, q=.82){
  const bmp = await createImageBitmap(src).catch(()=>null); if(!bmp) return null;
  const k=Math.min(1, max/Math.max(bmp.width,bmp.height)); const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height); return c.toDataURL('image/jpeg', q);
}

/* ---------- imágenes reales: frascos y notas ---------- */
const TILE_BG = '#F4F2EF';
const IMGC = (()=>{ try{ return JSON.parse(localStorage.getItem('olfi-imgs3')||'{}'); }catch(e){ return {}; } })();
function imgCacheSet(k,v){ IMGC[k]=v; try{ localStorage.setItem('olfi-imgs3', JSON.stringify(IMGC)); }catch(e){} }
const imgKey = p => 'p:'+norm((p.brand||'')+' '+p.name);
function loadOK(u, ms=8000){ return new Promise(res=>{ if(!u) return res(false); const i=new Image(); const t=setTimeout(()=>{ i.src=''; res(false); }, ms); i.onload=()=>{ clearTimeout(t); res(i.naturalWidth>40); }; i.onerror=()=>{ clearTimeout(t); res(false); }; i.referrerPolicy='no-referrer'; i.src=u; }); }
async function getJSON(u){ const r=await fetch(u); if(!r.ok) throw 0; return r.json(); }
async function wikiThumb(title, lang='es'){
  try{ const j=await getJSON(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title.replace(/ /g,'_'))}`);
    if(j.type==='disambiguation') return null; return j.thumbnail?.source || j.originalimage?.source || null; }catch(e){ return null; }
}
async function wikiPerfumeThumb(title, lang, name){
  try{ const j=await getJSON(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title.replace(/ /g,'_'))}`);
    if(j.type!=='standard') return null;
    const txt=((j.description||'')+' '+(j.extract||'')).toLowerCase();
    if(!/perfume|fragrance|fragancia|eau de|parfum/.test(txt)) return null;
    if(!norm(j.title).includes(norm(name).split(' ')[0])) return null;
    return j.thumbnail?.source || null; }catch(e){ return null; }
}
async function wikiSearchThumb(q, lang='es', must=''){
  try{ const j=await getJSON(`https://${lang}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=3&prop=pageimages&piprop=thumbnail&pithumbsize=330&format=json&origin=*`);
    const pages=Object.values(j.query?.pages||{}).sort((a,b)=>a.index-b.index);
    const hit=pages.find(p=>p.thumbnail && (!must || norm(p.title).includes(must))); return hit?.thumbnail.source || null; }catch(e){ return null; }
}

/* frascos */
const P_PENDING = new Set(), P_DONE = new Set(); let pQueue=Promise.resolve();
function fragIdOf(u){ const m=String(u||'').match(/fragrantica\.[a-z.]+\/(?:perfume|perfumes)\/[^"' ]*?-(\d+)\.html/i) || String(u||'').match(/-(\d{3,6})\.html/); return m?m[1]:null; }
function pSrc(p){
  if(!p) return null;
  if(p.img) return {u:p.img, cat:true};
  const c=IMGC[imgKey(p)]; if(c) return {u:c, cat:true};
  return null;
}
const monogram = p => { const w=((p?.brand||p?.name||'?').trim().split(/\s+/).map(x=>x[0]).join('').slice(0,2)||'?').toUpperCase(); return w; };
function pimg(id, box, opts={}){
  const p=P(id); const s=pSrc(p); if(p && (!s || !s.cat)) resolveP(id);
  const gray = opts.gray ? 'filter:grayscale(1);opacity:.55;' : '';
  const pad = opts.pad ?? '8%';
  const inner = s ? `<img data-pid="${esc(id)}" src="${esc(s.u)}" alt="" referrerpolicy="no-referrer" style="width:100%;height:100%;display:block;${s.cat?`object-fit:contain;padding:${pad};mix-blend-mode:multiply;`:'object-fit:cover;'}${gray}" onerror="this.style.visibility='hidden'">`

async function geminiCall(key, prompt, b64, signal, opts={}){
  const cfg=AI.get()||{}; let models = cfg.model ? [cfg.model, ...GEMINI_MODELS.filter(m=>m!==cfg.model)] : GEMINI_MODELS;
  let lastErr=null;
  for(const m of models){
    for(const withSearch of (opts.tools==='web'?['web','search',false]:['search',false])){
      const parts=[{text:prompt}]; if(b64) parts.push({inline_data:{mime_type:'image/jpeg', data:b64}});
      const body={contents:[{role:'user',parts}], generationConfig:{temperature:0.2}};
      if(withSearch==='web') body.tools=[{google_search:{}},{url_context:{}}]; else if(withSearch) body.tools=[{google_search:{}}];
      let r;
      try{ r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal}); }
      catch(e){ if(e.name==='AbortError') throw e; throw new AIError('network','No hay conexión a internet.'); }
      if(r.ok){
        const j=await r.json(); const txt=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
        if(txt.trim()){ if(cfg.model!==m) AI.set({...cfg, model:m}); return txt; }
        lastErr=new AIError('empty','La IA no ha devuelto respuesta.'); continue;
      }
      const e=await r.json().catch(()=>({})); const msg=(e.error?.message||'')+''; const st=e.error?.status||'';
      if(r.status===400 && /API key|API_KEY/i.test(msg)) throw new AIError('key','La clave no es válida. Revísala en Ajustes.');
      if(r.status===401 || r.status===403) throw new AIError('key','La clave no es válida o no tiene permiso. Revísala en Ajustes.');
      if(r.status===404){ lastErr=new AIError('model','Modelo no disponible'); break; } // siguiente modelo
      if(r.status===429){ lastErr=new AIError('quota','Has llegado al límite gratuito de hoy. Vuelve a intentarlo más tarde.'); if(withSearch) continue; break; }
      if(r.status===400 && withSearch){ lastErr=new AIError('bad',msg); continue; } // prueba sin búsqueda
      lastErr=new AIError('server', msg||('Error '+r.status)); if(r.status>=500) break; else break;
    }
  }
  throw lastErr || new AIError('server','No se ha podido contactar con la IA.');

  const ex = Object.values(S.items).find(x=>norm(x.name)===norm(p.name) && norm(x.brand)===norm(p.brand));
  p.id = ex ? ex.id : 't'+norm(p.brand+' '+p.name).replace(/ /g,'-').slice(0,60);
  return p;
}
function stash(p){ if(S.items[p.id]){ const keep=S.items[p.id]; for(const k of ['acc','perfumer','gender','seasons','occasions','desc','similar','dur','estela','year','conc','fragUrl']) if(!keep[k] || (Array.isArray(keep[k])&&!keep[k].length)) keep[k]=p[k]; if(!keep.notes.flat().length) keep.notes=p.notes; save(); return keep; } TEMP[p.id]=p; return p; }
function ensureItem(id){ if(!S.items[id] && TEMP[id]){ S.items[id]=TEMP[id]; delete TEMP[id]; } }

async function identifyPhoto(blob){
  stopCam();
  const url=URL.createObjectURL(blob);
  const ctl=new AbortController();
  SCAN={state:'ai', url, blob, ctl}; render(true);
  try{
    const r=parseJSON(await aiAsk(PROMPT_PHOTO, blob, ctl.signal));
    if(SCAN.ctl!==ctl) return;
    if(r.esPerfume===false || !r.nombre){ SCAN={state:'aino', url, blob}; render(true); return; }
    const n=fromAI(r); if(!S.items[n.id]) n.scanPhoto=await toJpeg(blob, 640, .8);
    const p=stash(n); SCAN={state:'airesult', url, blob, id:p.id}; render(true);
  }catch(e){ if(e.name==='AbortError' || SCAN.ctl!==ctl) return; SCAN={state:'aierror', url, blob, err:aiErrText(e)}; render(true); }
}
async function lookupName(q, where){
  const ctl=new AbortController(); LOOK={state:'loading', q, ctl, where}; drawLook();
  try{
    const r=parseJSON(await aiAsk(promptName(q), null, ctl.signal));
    if(LOOK.ctl!==ctl) return;
    if(r.encontrado===false || !r.nombre){ LOOK={state:'none', q, where}; drawLook(); return; }
    const p=stash(fromAI(r)); LOOK={state:'done', q, id:p.id, where}; drawLook();
  }catch(e){ if(e.name==='AbortError' || LOOK.ctl!==ctl) return; LOOK={state:'error', q, err:aiErrText(e), where}; drawLook(); }
}
let LOOK={state:'idle'};
function drawLook(){
  if(LOOK.where==='scan' && TAB==='escanear' && !layerStack.length){ if(LOOK.state==='done'){ SCAN={...SCAN, state:'airesult', id:LOOK.id}; } else if(LOOK.state==='loading'){ SCAN={...SCAN, state:'ai'}; } else if(LOOK.state==='error'){ SCAN={...SCAN, state:'aierror', err:LOOK.err}; } render(true); return; }

}

function week(){
  const days=[]; const names=['D','L','M','X','J','V','S'];
  for(let i=6;i>=0;i--){ const date=daysAgo(i); const d=new Date(); d.setDate(d.getDate()-i); const l=S.logs.find(x=>x.date===date); days.push({date, l: l&&P(l.id)?l:null, label:names[d.getDay()]}); }
  const logs=days.filter(d=>d.l).map(d=>d.l);
  const cnt={}, fam={}; logs.forEach(l=>{ cnt[l.id]=(cnt[l.id]||0)+1; const f=P(l.id)?.family; if(f) fam[f]=(fam[f]||0)+1; });
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0]; const fTop=Object.entries(fam).sort((a,b)=>b[1]-a[1])[0];
  const set=new Set(S.logs.map(l=>l.date)); let streak=0, k=set.has(today())?0:1; while(set.has(daysAgo(k))){ streak++; k++; }
  return {days, logs, distinct:Object.keys(cnt).length, top, fTop, streak};
}
function recommend(){
  const owned=S.coll.filter(c=>c.shelf==='tengo' && (c.level==null || c.level>0) && P(c.id));
  if(!owned.length) return null;
  const t=Date.parse(today());
  const last=id=>{ const l=S.logs.filter(x=>x.id===id).map(x=>x.date).sort().pop(); return l? Math.round((t-Date.parse(l))/864e5) : 14; };
  return owned.map(c=>({c, s:(c.score??7) + Math.min(last(c.id),10)*0.35 - (last(c.id)===0?5:0) - (c.level!=null && c.level<15?0.8:0)})).sort((a,b)=>b.s-a.s)[0].c;
}

perfil(){
  const tengo=S.coll.filter(c=>c.shelf==='tengo'&&P(c.id));
  const fam={}; tengo.forEach(c=>{const f=P(c.id).family; fam[f]=(fam[f]||0)+1;});
  const tot=tengo.length||1; const famList=Object.entries(fam).sort((a,b)=>b[1]-a[1]).slice(0,5); const maxF=famList[0]?famList[0][1]:1;
  const n=s=>S.coll.filter(c=>c.shelf===s&&P(c.id)).length;
  const items=S.coll.filter(c=>c.shelf===SHELF&&P(c.id)).sort((a,b)=>(b.score??0)-(a.score??0));
  const days=new Set(S.logs.map(l=>l.date)).size;
  const emptyTxt={agotados:'Aquí irán los perfumes que se te acaben. En su ficha, pulsa «Se me ha acabado».', deseo:'Aquí irán los perfumes que quieres. Al añadir uno, elige «Deseo».', muestras:'Aquí irán tus muestras y decants.'}[SHELF];
  return `<div class="stack">
   <div class="row between" style="height:52px"><span></span><span class="row" style="gap:0"><button class="ib" data-act="amigos" aria-label="Amigos">${ic('addp',23,1.6)}</button><button class="ib" data-act="ajustes" aria-label="Ajustes">${ic('sliders',22,1.6)}</button></span></div>
   <div><h1 style="font-size:28px">${esc(S.name||'Tu perfil')}</h1><span class="sm muted">${S.coll.length} ${S.coll.length===1?'perfume':'perfumes'} · ${Object.keys(S.reviews).length} reseñas · ${days} ${days===1?'día apuntado':'días apuntados'}</span></div>
   ${famList.length?`<section class="stack" style="gap:12px"><div class="row between"><span class="cap">Tu firma olfativa</span><span class="xs muted">de ${tengo.length} ${tengo.length===1?'perfume':'perfumes'}</span></div>
    <div class="row" style="align-items:flex-end;justify-content:space-around;padding:0 4px">${famList.map(([f,c])=>`<div class="vial"><span class="t"><span style="height:${Math.round(c/maxF*90)}%;background:${famColor(f)}"></span></span>${esc(f)}<span class="muted" style="font-weight:400">${Math.round(c/tot*100)} %</span></div>`).join('')}</div></section>`:''}
   <div class="seg" role="group" aria-label="Estanterías">${[['tengo','Tengo'],['agotados','Agotados'],['deseo','Deseo'],['muestras','Muestras']].map(([k,l])=>`<button data-shelf="${k}" aria-pressed="${SHELF===k}">${l} <span style="opacity:.7;font-weight:500">${n(k)}</span></button>`).join('')}</div>
   ${items.length ? shelfHTML(items) : (SHELF==='tengo' ? startCard() : `<p class="muted sm" style="margin:0">${emptyTxt}</p>`)}
   ${installCard()}
  </div>`;
}
};
function shelfHTML(cs){
  const rows=[]; for(let i=0;i<cs.length;i+=3) rows.push(cs.slice(i,i+3));
  return rows.map(r=>`<section class="stack" style="gap:0;margin-bottom:8px">
   <div class="shelf" style="grid-template-columns:repeat(3,minmax(0,1fr))">${r.map(c=>`<button class="tap" data-open="${c.id}" aria-label="${esc(P(c.id).name)}" style="display:flex;justify-content:center;align-items:flex-end;min-height:118px;padding-bottom:2px">${visual(c.id, 104, SHELF==='agotados')}</button>`).join('')}</div>
   <div class="plank" style="margin-top:-2px"></div>
   <div class="shelf" style="grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding-top:8px">${r.map(c=>{const p=P(c.id); const low=c.level!=null&&c.level>0&&c.level<15;
     const sub = SHELF==='agotados' ? 'se acabó' : SHELF==='deseo' ? esc(p.brand) : `${c.score!=null?num(c.score):'sin nota'}${c.level!=null&&SHELF==='tengo'?' · '+(low?'queda poco':c.level+' %'):''}`;
     return `<span style="text-align:center;line-height:1.25;min-width:0"><b style="font-size:12px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</b><span style="font-size:11px;color:${low?'var(--warn)':'var(--muted)'}">${sub}</span></span>`;}).join('')}</div>
  </section>`).join('');
}

/* ---------- formulario de perfume ---------- */
let FORM=null; // {id?, photo, name, brand, ..., ocr:[], ocrState, barcode}
function openForm(init={}){
  FORM = Object.assign({shelf:'tengo', family:'', conc:'', notes:[[],[],[]]}, init);
  drawForm();
}
function drawForm(){
  const f=FORM; const editing=!!f.id;
  const html=`<div class="wrap"><div class="bar-top"><button class="ib" data-close aria-label="Cancelar">${ic('close',22,1.9)}</button><b style="font-weight:600">${editing?'Editar perfume':'Nuevo perfume'}</b><span style="width:44px"></span></div>
   <div class="pad stack form" style="padding-top:8px;gap:8px">
    ${editing?'':`<span class="xs muted">${f.img?'Foto del catálogo':'La foto solo sirve para leer la etiqueta; en tu colección se mostrará la foto oficial del perfume.'}</span>`}
    <div class="row" style="gap:12px;align-items:flex-start;${editing?'display:none':''}">
     <div style="width:96px;height:120px;border-radius:16px;overflow:hidden;background:${TILE_BG};display:flex;align-items:center;justify-content:center;flex-shrink:0">${f.img?`<img src="${esc(f.img)}" alt="" style="width:100%;height:100%;object-fit:contain;padding:8%;mix-blend-mode:multiply">`:f.photo?`<img src="${esc(f.photo)}" alt="" style="width:100%;height:100%;object-fit:cover">`:`<span class="mono" style="font-size:20px">${ic('cam',26,1.5)}</span>`}</div>
     <div class="stack" style="gap:8px;flex:1"><label for="cam" class="btn lbl" data-photo="form" style="height:40px">${ic('cam',18,1.8)} ${f.photo?'Otra foto':'Hacer foto'}</label><label for="gal" class="btn lbl" data-photo="form" style="height:40px">${ic('img',18,1.7)} Galería</label></div>
    </div>
    ${f.ocrState==='loading'?loading('Leyendo el texto de la etiqueta…'):''}
    ${f.ocr&&f.ocr.length?`<div class="stack" style="gap:6px"><span class="xs muted">Texto leído en la etiqueta. Toca una línea para ponerla en el campo seleccionado:</span><div class="ocr">${f.ocr.map((t,i)=>`<button data-ocr="${i}">${esc(t)}</button>`).join('')}</div></div>`:''}
    ${f.ocrState==='empty'?'<p class="xs muted" style="margin:0">No se ha podido leer texto en la foto. Escribe los datos a mano.</p>':''}
    ${f.match?`<button class="tap card row" data-open="${f.match}" style="border-color:var(--brand)"><span class="grow"><span class="xs muted" style="display:block">¿Es este, que ya tienes?</span><b style="font-weight:600">${esc(P(f.match).name)}</b></span><span class="muted">${ic('chev',16,2)}</span></button>`:''}
    <label for="f_name">Nombre *</label><input id="f_name" class="field" value="${esc(f.name||'')}" placeholder="Ej.: Sauvage" autocomplete="off">
    <label for="f_brand">Marca</label><input id="f_brand" class="field" value="${esc(f.brand||'')}" placeholder="Ej.: Dior" autocomplete="off">
    <div class="two"><div class="stack" style="gap:6px"><label for="f_family">Familia</label><select id="f_family" class="field"><option value="">Elige…</option>${FAMILIES.map(x=>`<option ${f.family===x?'selected':''}>${x}</option>`).join('')}</select></div>
     <div class="stack" style="gap:6px"><label for="f_conc">Concentración</label><select id="f_conc" class="field"><option value="">–</option>${CONCS.map(x=>`<option ${f.conc===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
    <div class="two"><div class="stack" style="gap:6px"><label for="f_year">Año</label><input id="f_year" class="field" inputmode="numeric" value="${esc(f.year||'')}" placeholder="2024"></div>
     <div class="stack" style="gap:6px"><label for="f_size">Tamaño</label><input id="f_size" class="field" value="${esc(f.size||'')}" placeholder="100 ml"></div></div>
    <label for="f_top">Notas de salida</label><input id="f_top" class="field" value="${esc(f.notes[0].join(', '))}" placeholder="Bergamota, pimienta rosa">
    <label for="f_mid">Notas de corazón</label><input id="f_mid" class="field" value="${esc(f.notes[1].join(', '))}" placeholder="Lavanda, iris">
    <label for="f_base">Notas de fondo</label><input id="f_base" class="field" value="${esc(f.notes[2].join(', '))}" placeholder="Ámbar, vetiver">
    <div class="two"><div class="stack" style="gap:6px"><label for="f_dur">Duración</label><input id="f_dur" class="field" value="${esc(f.dur||'')}" placeholder="6–8 h"></div>
     <div class="stack" style="gap:6px"><label for="f_estela">Estela</label><select id="f_estela" class="field"><option value="">–</option>${['Suave','Moderada','Intensa'].map(x=>`<option ${f.estela===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
    ${editing?'':`<label>Dónde lo guardo</label><div class="seg" role="group">${[['tengo','Tengo'],['deseo','Deseo'],['muestras','Muestra']].map(([k,l])=>`<button data-fshelf="${k}" aria-pressed="${f.shelf===k}">${l}</button>`).join('')}</div>`}
    ${f.barcode?`<p class="xs muted" style="margin:0">Código de barras: ${esc(f.barcode)}. La próxima vez que lo escanees, Olfi lo reconocerá.</p>`:''}
    <button class="btn primary block" data-act="saveform" style="margin-top:8px">${editing?'Guardar cambios':'Guardar perfume'}</button>
   </div></div>`;
  const prev = layerStack[layerStack.length-1]; let y=0;
  if(prev && prev.dataset.key==='form'){ y=prev.scrollTop; prev.remove(); layerStack.pop(); }
  const el=openLayer(html,'sheet','form'); el.scrollTop=y;
  if(LASTFIELD){ const i=el.querySelector('#'+LASTFIELD); if(i) i.dataset.last='1'; }
}
let LASTFIELD='f_name';
function readForm(){
  const v=id=>$('#'+id)?.value.trim()||'';
  Object.assign(FORM,{name:v('f_name'),brand:v('f_brand'),family:v('f_family'),conc:v('f_conc'),year:v('f_year'),size:v('f_size'),dur:v('f_dur'),estela:v('f_estela'),notes:[splitNotes(v('f_top')),splitNotes(v('f_mid')),splitNotes(v('f_base'))]});
}
function saveForm(){
  readForm(); const f=FORM;
  if(!f.name){ toast('Escribe el nombre del perfume'); $('#f_name')?.focus(); return; }
  const id=f.id||newId();
  const p={...(S.items[id]||{}), id, name:f.name, brand:f.brand, family:f.family||'Amaderado', conc:f.conc, year:Number(f.year)||null, size:f.size, dur:f.dur, estela:f.estela, notes:f.notes, scanPhoto:f.photo||null, photo:null, ...(f.img?{img:f.img}:{}), barcode:f.barcode||P(id)?.barcode||null};
  S.items[id]=p;
  if(!mine(id)) S.coll.push({id, shelf:f.shelf, score:null, level:f.shelf==='tengo'?100:null});
  save(); FORM=null; closeAll();
  toast(f.id?'Cambios guardados':'Guardado en «'+({tengo:'Tengo',deseo:'Deseo',muestras:'Muestras'}[f.shelf])+'»');
  if(TAB==='escanear'){ SCAN={state:'idle'}; }
  openFicha(id);
}

let layerStack=[];
function openLayer(html, kind='sheet', key=''){
  stopCam();
  const el=document.createElement('div'); el.className=kind; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); el.dataset.key=key;
  el.innerHTML = kind==='modal' ? `<div class="panel">${html}</div>` : html;
  $('#layer').appendChild(el); layerStack.push(el); document.body.style.overflow='hidden';
  if(layerStack.length===1 && !history.state?.layer) history.pushState({layer:1},'');
  return el;
}
function closeAll(){ while(layerStack.length) layerStack.pop().remove(); document.body.style.overflow=''; }
function closeLayer(){ const el=layerStack.pop(); if(el) el.remove(); if(!layerStack.length){ document.body.style.overflow=''; render(true); } }
window.addEventListener('popstate',()=>{ if(layerStack.length){ closeAll(); render(true); } });
function refreshTop(){ const el=layerStack[layerStack.length-1]; if(!el) return render(true); const k=el.dataset.key; const y=el.scrollTop; el.remove(); layerStack.pop(); if(k==='amigos') openAmigos(); else openFicha(k); const n=layerStack[layerStack.length-1]; if(n) n.scrollTop=y; }

/* ---------- cámara en directo, código de barras y lectura de etiqueta ---------- */
const CAM={stream:null, status:'idle', err:'', torch:false, torchOn:false};
const BARCODE = 'BarcodeDetector' in window;
let detector=null, detectT=null;
function afterRender(){
  if(TAB==='escanear' && !SCAN.url && SCAN.state==='idle' && !layerStack.length){ if(CAM.stream) attachCam(); else if(CAM.status!=='error' && CAM.status!=='starting') startCam(); }
  else stopCam();
}
function attachCam(){ const v=$('#camvideo'); if(v && CAM.stream && v.srcObject!==CAM.stream){ v.srcObject=CAM.stream; v.play().catch(()=>{}); } startDetect(); }
async function startCam(){
  if(!navigator.mediaDevices?.getUserMedia){ CAM.status='error'; CAM.err='Este navegador no deja usar la cámara en directo. Usa «Hacer foto».'; render(true); return; }
  CAM.status='starting'; render(true);
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080}}});
    if(TAB!=='escanear' || SCAN.url || SCAN.state!=='idle' || layerStack.length){ s.getTracks().forEach(t=>t.stop()); CAM.status='idle'; return; }
    CAM.stream=s; CAM.status='live';
    const track=s.getVideoTracks()[0]; CAM.torch=!!track?.getCapabilities?.().torch; CAM.torchOn=false;
    render(true);
  }catch(e){
    CAM.status='error';
    CAM.err = e?.name==='NotAllowedError' || e?.name==='SecurityError' ? 'No has dado permiso a la cámara. Actívalo en Ajustes del móvil › Apps › Olfi (o Chrome) › Permisos, o usa «Hacer foto».'
      : e?.name==='NotFoundError' || e?.name==='OverconstrainedError' ? 'No se ha encontrado ninguna cámara. Usa «Galería».'
      : e?.name==='NotReadableError' ? 'Otra app está usando la cámara. Ciérrala y vuelve a entrar.'
      : 'No se ha podido abrir la cámara. Usa «Hacer foto».';
    render(true);
  }
}
function stopCam(){ clearTimeout(detectT); detectT=null; if(CAM.stream){ CAM.stream.getTracks().forEach(t=>t.stop()); CAM.stream=null; } if(CAM.status!=='error') CAM.status='idle'; }
function startDetect(){
  if(!BARCODE || detectT || !CAM.stream) return;
  try{ detector ||= new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']}); }catch(e){ return; }
  const loop=async()=>{
    detectT=null; const v=$('#camvideo'); if(!CAM.stream || !v) return;
    if(v.readyState>=2){ try{ const r=await detector.detect(v); if(r && r[0] && r[0].rawValue){ onBarcode(r[0].rawValue); return; } }catch(e){} }
    if(CAM.stream) detectT=setTimeout(loop, 450);
  };
  detectT=setTimeout(loop, 600);
}
async function onBarcode(code){
  navigator.vibrate?.(40);
  const known=Object.values(S.items).find(p=>p.barcode===code);
  stopCam();
  if(known){ SCAN={state:'found', id:known.id}; render(true); return; }
  SCAN={state:'barcode', code}; render(true);
  let prod=null;
  try{
    const r=await fetch(`https://world.openbeautyfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_es,brands,quantity,image_front_url`,{headers:{'Accept':'application/json'}});
    const j=await r.json(); if(j.status===1) prod=j.product;
  }catch(e){}
  if(!prod || !(prod.product_name_es||prod.product_name)){ SCAN={state:'notfound', code}; render(true); FORM_BARCODE=code; return; }
  if(AI.ready()){ SCAN={state:'ai'}; lookupName([(prod.brands||'').split(',')[0], prod.product_name_es||prod.product_name].filter(Boolean).join(' '), 'scan'); return; }
  SCAN={state:'idle'};
  openForm({name:prod.product_name_es||prod.product_name, brand:(prod.brands||'').split(',')[0].trim(), size:prod.quantity||'', barcode:code, img:prod.image_front_url||null});
  toast('Encontrado en Open Beauty Facts');
}
let FORM_BARCODE=null;
async function shoot(){
  const v=$('#camvideo'); if(!v || !v.videoWidth) return;
  const W=v.videoWidth, H=v.videoHeight; const k=Math.min(1, 1600/Math.max(W,H));
  const c=document.createElement('canvas'); c.width=Math.round(W*k); c.height=Math.round(H*k); c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  // zona del recuadro para leer el texto
  const o=document.createElement('canvas'); const sx=W*.12, sy=H*.12, sw=W*.76, sh=H*.70; o.width=Math.round(sw); o.height=Math.round(sh);
  o.getContext('2d').drawImage(v,sx,sy,sw,sh,0,0,o.width,o.height);
  navigator.vibrate?.(30); stopCam();
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.9)); const crop=await new Promise(r=>o.toBlob(r,'image/png'));
  if(AI.ready()) identifyPhoto(blob); else photoToForm(blob, crop);
}
async function photoToForm(blob, ocrSrc){
  const photo=await toJpeg(blob);
  const bc=FORM_BARCODE; FORM_BARCODE=null; SCAN={state:'idle'};
  openForm({photo, barcode:bc, ocrState:'loading'});
  // lectura del código de barras en la foto (si no se vio en directo)
  if(BARCODE && !bc){ try{ detector ||= new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']}); const bmp=await createImageBitmap(blob); const r=await detector.detect(bmp); if(r[0]?.rawValue && FORM){ FORM.barcode=r[0].rawValue; } }catch(e){} }
  const lines=await readText(ocrSrc||blob);
  if(!FORM) return; readFormSafe();
  FORM.ocr=lines; FORM.ocrState=lines.length?'done':'empty';
  const txt=norm(lines.join(' '));
  const m=Object.values(S.items).find(p=>p.name.length>2 && txt.includes(norm(p.name)) && (!p.brand || txt.includes(norm(p.brand).split(' ')[0])));
  if(m) FORM.match=m.id;
  if(!FORM.name && lines[0]){ const big=lines.slice().sort((a,b)=>b.length-a.length); FORM.brand ||= lines[0]; FORM.name = (lines[1]&&lines[1]!==lines[0])?lines[1]:big[0]; }
  drawForm();
}
function readFormSafe(){ if($('#f_name')) readForm(); }
let ocrWorker=null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function readText(src){
  try{
    if(!window.Tesseract) await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
    ocrWorker ||= await Tesseract.createWorker(['eng','spa','fra']);
    const {data}=await ocrWorker.recognize(src);
    return [...new Set(String(data.text||'').split('\n').map(l=>l.replace(/[^\p{L}\p{N}'&.\- ]/gu,' ').replace(/\s+/g,' ').trim())
      .filter(l=>l.length>=3 && l.length<=40 && (l.match(/\p{L}/gu)||[]).length>=3))].slice(0,10);
  }catch(e){ return []; }
}

/* ---------- acciones ---------- */
function setShelf(id, shelf){
  ensureItem(id); const c=mine(id); const lab={tengo:'«Tengo»',deseo:'«Deseo»',muestras:'«Muestras»'}[shelf];
  if(c && c.shelf===shelf){ toast('Ya está en '+lab); return; }
  if(c){ c.shelf=shelf; if(shelf==='tengo'){ c.level=100; delete c.ended; } toast('Movido a '+lab); }
  else { S.coll.push({id,shelf,score:null,level:shelf==='tengo'?100:null}); toast('Añadido a '+lab); }
  save();
}
function logToday(id, occ){ ensureItem(id); const c=mine(id); if(!c) S.coll.push({id,shelf:'tengo',score:null,level:100}); S.logs=S.logs.filter(l=>l.date!==today()); S.logs.push({date:today(),id,occ:occ||null}); save(); toast('Apuntado: hoy llevas '+P(id).name); }
function removeItem(id){ S.coll=S.coll.filter(c=>c.id!==id); S.logs=S.logs.filter(l=>l.id!==id); delete S.reviews[id]; delete S.items[id]; save(); }

document.addEventListener('click', e=>{
  const lbl=e.target.closest('label[data-photo]'); if(lbl){ PHOTO_FOR=lbl.dataset.photo; return; }
  const t=e.target.closest('button, [data-open]'); if(!t) return;
  const d=t.dataset;
  if(d.tab){ closeAll(); TAB=d.tab; if(TAB==='escanear') SCAN={state:'idle'}; else FORM_BARCODE=null; render(); return; }
  if(d.open){ closeAll(); openFicha(d.open); return; }
  if('close' in d){ if(layerStack[layerStack.length-1]?.dataset.key==='form') FORM=null; closeLayer(); return; }
  if(d.shelf){ SHELF=d.shelf; render(true); return; }
  if(d.fshelf){ readForm(); FORM.shelf=d.fshelf; drawForm(); return; }
  if('famf' in d){ FAMF=FAMF===d.famf?null:d.famf; render(true); return; }
  if(d.ocr!=null){ readForm(); const val=FORM.ocr[+d.ocr]; const map={f_name:'name',f_brand:'brand',f_size:'size',f_year:'year'}; const key=map[LASTFIELD]||'name'; FORM[key]=val; LASTFIELD = key==='name'?'f_brand':LASTFIELD; drawForm(); return; }
  if(d.set){ setShelf(layerStack[layerStack.length-1].dataset.key, d.set); refreshTop(); return; }
  if(d.occ){ document.querySelectorAll('[data-occ]').forEach(b=>b.setAttribute('aria-pressed', String(b===t && b.getAttribute('aria-pressed')!=='true'))); return; }
  if(d.logid){ const occ=document.querySelector('[data-occ][aria-pressed="true"]')?.dataset.occ; logToday(d.logid, occ); closeAll(); render(true); return; }
  if(d.prov){ const c=AI.get()||{}; AI.set({...c, provider:d.prov, model:null}); document.querySelectorAll('[data-prov]').forEach(b=>b.setAttribute('aria-pressed', String(b===t))); $('#provhelp').innerHTML=provHelp(d.prov); $('#aikey').placeholder=d.prov==='claude'?'sk-ant-…':'AIza…'; return; }
  if(d.alt){ const q=d.alt; closeAll(); if(TAB==='escanear' && SCAN.state!=='idle'){ lookupName(q,'scan'); } else { TAB='descubrir'; Q=q; render(); lookupName(q,'search'); } return; }
  switch(d.act){
    case 'aisetup': closeAll(); openAISetup(); break;
    case 'aisave': { const k=$('#aikey').value.trim().replace(/\s+/g,''); if(!k){ toast('Pega la clave primero'); break; } const c=AI.get()||{provider:'gemini'}; AI.set({...c, provider:c.provider||'gemini', key:k}); testAI(); break; }
    case 'aidel': { const c=AI.get()||{}; AI.set({provider:c.provider||'gemini', key:''}); closeAll(); render(true); toast('Clave quitada'); break; }
    case 'keep': { const id=d.id; setShelf(id, d.to); if(TAB==='escanear') render(true); else render(true); break; }
    case 'retryai': if(SCAN.blob) identifyPhoto(SCAN.blob); break;
    case 'manualfromphoto': { const b=SCAN.blob; SCAN={state:'idle'}; if(b) photoToForm(b); else openForm({}); break; }
    case 'enrich': enrich(d.id); break;
    case 'retryimg': { const p=S.items[d.id]; delete p.imgChecked; delete p.img; P_PENDING.delete(d.id); P_DONE.delete(d.id); save(); refreshTop(); break; }
    case 'amigos': openAmigos(); break;
    case 'logpick': openPicker(); break;
    case 'new': closeAll(); openForm({barcode:FORM_BARCODE}); FORM_BARCODE=null; break;
    case 'edit': { const p=P(d.id); closeAll(); openForm(JSON.parse(JSON.stringify(p))); FORM.ocr=null; break; }
    case 'saveform': saveForm(); break;
    case 'shoot': shoot(); break;
    case 'torch': { const tr=CAM.stream?.getVideoTracks()[0]; CAM.torchOn=!CAM.torchOn; tr?.applyConstraints({advanced:[{torch:CAM.torchOn}]}).catch(()=>{}); t.setAttribute('aria-pressed',CAM.torchOn); t.style.background=CAM.torchOn?'#fff':'rgba(0,0,0,.4)'; t.style.color=CAM.torchOn?'#141414':'#fff'; break; }
    case 'rescan': SCAN.ctl?.abort(); LOOK.ctl?.abort(); SCAN={state:'idle'}; LOOK={state:'idle'}; render(true); break;
    case 'camon': CAM.status='idle'; startCam(); break;
    case 'wearscan': logToday(SCAN.id); SCAN={state:'idle'}; TAB='inicio'; render(); break;
    case 'wear': logToday(d.id); refreshTop(); break;
    case 'empty': { const c=mine(d.id); c.shelf='agotados'; c.level=0; c.ended=today().slice(0,7); save(); toast('Movido a «Agotados»'); refreshTop(); break; }
    case 'remove': if(t.dataset.sure){ removeItem(d.id); closeAll(); toast('Perfume borrado'); render(true); } else { t.dataset.sure='1'; t.textContent='Pulsa otra vez para borrarlo'; } break;
    case 'review': { const v=$('#rev').value.trim(); if(v) S.reviews[d.id]=v; else delete S.reviews[d.id]; save(); toast(v?'Reseña guardada':'Reseña borrada'); break; }
    case 'shareweek': { const w=week(); const txt=`Mi semana en Olfi: ${w.distinct} ${w.distinct===1?'perfume':'perfumes'}.${w.top?' El más usado: '+P(w.top[0]).name+'.':''} ${w.streak} días seguidos.`; share(txt); break; }
    case 'sharep': { const p=P(d.id); share(`${p.name}${p.brand?' de '+p.brand:''}`); break; }
    case 'invite': share(`Te invito a Olfi, una app para guardar tu colección de perfumes: ${location.origin+location.pathname}`); break;
    case 'install': installEvt?.prompt(); installEvt?.userChoice.finally(()=>{ installEvt=null; render(true); }); break;
    case 'ajustes': openLayer(`<div class="grab"></div><h2 style="margin-bottom:12px">Ajustes</h2><div class="stack" style="gap:10px"><label class="sm" for="nm">Nombre</label><input id="nm" class="field" style="padding:0 14px" value="${esc(S.name)}"><button class="btn primary" data-act="saveprofile">Guardar</button>
      <h2 style="margin-top:10px">Reconocimiento de perfumes</h2><button class="btn" data-act="aisetup">${AI.ready()?'IA activada · cambiar clave':'Activar la IA'}</button>
      <h2 style="margin-top:10px">Copia de seguridad</h2><p class="sm muted" style="margin:0">Tus datos se guardan solo en este móvil. Descarga una copia de vez en cuando, o para pasarlos a otro móvil.</p>
      <button class="btn" data-act="export">${ic('down',18,1.8)} Descargar copia</button><label for="imp" class="btn lbl">Restaurar una copia</label>
      <button class="btn" data-act="wipe" style="color:var(--warn);margin-top:10px">Borrar todos mis datos</button></div>`,'modal','ajustes'); break;
    case 'saveprofile': S.name=$('#nm').value.trim(); save(); closeLayer(); toast('Perfil guardado'); break;
    case 'export': { const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'})); a.download=`olfi-copia-${today()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast('Copia descargada'); break; }
    case 'wipe': if(t.dataset.sure){ const n=S.name; S=empty(); S.started=true; S.name=n; save(); closeAll(); TAB='inicio'; render(); toast('Datos borrados'); } else { t.dataset.sure='1'; t.textContent='Pulsa otra vez para borrarlo todo'; } break;
    case 'start': { const n=$('#wname').value.trim(); if(!n){ $('#wname').focus(); toast('Escribe tu nombre'); break; } S=empty(); S.started=true; S.name=n; save(); $('#welcome')?.remove(); TAB='inicio'; render(); break; }
  }
});
function share(text){ if(navigator.share) navigator.share({text}).catch(()=>{}); else navigator.clipboard?.writeText(text).then(()=>toast('Copiado'),()=>toast(text)); }
document.addEventListener('click', e=>{ if(e.target.classList?.contains('modal')) closeLayer(); });
document.addEventListener('submit', e=>{ if(e.target.id==='aform'){ e.preventDefault(); Q=$('#q').value.trim(); if(!AI.ready()) return; if(Q.length<2){ toast('Escribe el nombre del perfume'); return; } $('#q').blur(); lookupName(Q,'search'); } });
async function enrich(id){
  const p=S.items[id]; if(!p) return; toast('Buscando información…');
  try{ const r=parseJSON(await aiAsk(promptName((p.brand?p.brand+' ':'')+p.name), null)); const n=fromAI(r); if(!n) throw new AIError('none','No se ha encontrado información.');
    for(const k of ['acc','perfumer','gender','seasons','occasions','desc','similar','dur','estela','year','conc','family','fragUrl']) if(n[k] && (!Array.isArray(n[k])||n[k].length)) p[k]=n[k];
    if(n.notes.flat().length) p.notes=n.notes; p.source='ia'; save(); if(!p.img) resolveP(id); toast('Información completada'); if(layerStack[layerStack.length-1]?.dataset.key===id) refreshTop();
  }catch(e){ toast(aiErrText(e)); }
}
document.addEventListener('focusin', e=>{ if(e.target.id && e.target.id.startsWith('f_')) LASTFIELD=e.target.id; });
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.id==='q'){ Q=t.value; const pos=t.selectionStart; render(true); const q=$('#q'); q.focus(); q.setSelectionRange(pos,pos); }
  if(t.id==='rate'){ const c=mine(t.dataset.id); c.score=Number(t.value); $('#rateval').textContent=num(c.score); save(); }
  if(t.id==='lvl'){ const c=mine(t.dataset.id); c.level=Number(t.value); $('#lvlval').textContent=c.level+' %'; save(); }
});
function onFile(e){
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  const target=PHOTO_FOR||'scan'; PHOTO_FOR=null;
  if(target==='scan'){ stopCam(); if(AI.ready()) identifyPhoto(f); else photoToForm(f); return; }
  if(target==='form'){ readFormSafe(); toJpeg(f).then(u=>{ if(FORM&&u){ FORM.photo=u; drawForm(); } }); return; }
}

function welcome(){
  const el=document.createElement('div'); el.id='welcome'; el.className='sheet';
  el.innerHTML=`<div class="wrap pad" style="min-height:100%;display:flex;flex-direction:column;padding-top:calc(48px + env(safe-area-inset-top, 0px))">
   <div style="display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;margin-top:18vh">${logo(46)}<p class="muted" style="margin:0;max-width:280px">Lo que hueles, compartido.</p></div>
   <div class="stack" style="gap:12px;margin-top:auto;padding-top:36px">
    <label for="wname" class="sm"><b style="font-weight:600">¿Cómo te llamas?</b></label>
    <input id="wname" class="field" style="padding:0 16px" placeholder="Tu nombre" autocomplete="given-name" enterkeyhint="go">
    <button class="btn primary block" data-act="start">Empezar</button>
   </div></div>`;
  document.body.appendChild(el);
  el.querySelector('#wname').addEventListener('keydown',e=>{ if(e.key==='Enter') el.querySelector('[data-act="start"]').click(); });
}

/* ---------- arranque ---------- */
(async()=>{
  S = await load();
  if(S && S.started && S.imgv!==4){ Object.values(S.items||{}).forEach(p=>{ if(p.photo && !p.img) p.scanPhoto=p.photo; delete p.photo; delete p.ownPhoto; if(S.imgv!==3){ delete p.img; } delete p.fragId; delete p.imgUrl; delete p.imgChecked; delete p.fragAsked; }); S.imgv=4; save(); }
  if(!S || !S.started){ S=empty(); render(); welcome(); } else render();
  if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
